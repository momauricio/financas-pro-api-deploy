services:
  financas-pro-api:
    build: .
    image: financas-pro-api:main
    container_name: financas-pro-api
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
  financas-pro-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: financas-pro-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://financas-pro-api:3001
    depends_on:
      - financas-pro-api
