services:
  financas-pro-api:
    image: node:20-bookworm-slim
    container_name: financas-pro-api
    restart: unless-stopped
    working_dir: /app
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
    command:
      - sh
      - -c
      - |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq git ca-certificates python3 make g++ >/dev/null
        rm -rf /tmp/src
        git clone --depth 1 --branch main https://github.com/momauricio/financas-pro-api-deploy.git /tmp/src
        cd /tmp/src
        npm install
        npx prisma generate
        npm run build
        mkdir -p /app
        cp -a dist node_modules prisma package.json /app/
        cd /app
        exec node dist/server.js
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
  financas-pro-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: financas-pro-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://financas-pro-api:3001
    depends_on:
      - financas-pro-api
